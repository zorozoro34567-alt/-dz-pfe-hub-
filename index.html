<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ PFE Hub - منصة مذكرات التخرج</title>
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
        }
        h1 { color: var(--primary); margin-bottom: 8px; }
        .upload-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            margin: 30px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DZ PFE Hub 🎓</h1>
            <p>المنصة الجزائرية لمشاركة مذكرات التخرج الجامعية</p>
        </header>

        <section class="upload-section">
            <h2>إضافة مذكرة جديدة</h2>
            <form id="pfeForm">
                <div class="form-group">
                    <label>عنوان المذكرة:</label>
                    <input type="text" placeholder="مثال: Study of Material Properties..." required>
                </div>
                <div class="form-group">
                    <label>التخصص / الجامعة:</label>
                    <input type="text" placeholder="مثال: علوم المادة - جامعة قسنطينة 1" required>
                </div>
                <div class="form-group">
                    <label>ملف المذكرة (PDF):</label>
                    <input type="file" accept=".pdf" required>
                </div>
                <button type="submit">رفع المذكرة الآن</button>
            </form>
        </section>
    </div>
</body>
</html>
